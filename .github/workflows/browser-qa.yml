name: Browser QA (responsive and accessibility interactions)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    # Playwright 1.55 (requirements-qa.txt) cannot install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Verify Chromium interactions at 320, 375, 768, 1440 px
        run: python scripts/browser_qa.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7

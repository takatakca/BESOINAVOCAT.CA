# Deploys to the owner's Coolify after green CI on main, as in takatak-v1.
# Disabled until the owner sets the repository variables and the production environment secrets
# described in docs/COOLIFY.md. Each application has its own switch.
name: BesoinAvocat Coolify deploy

on:
  workflow_run:
    workflows: ["Storefront checks", "Platform pilot checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: besoinavocat-coolify-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          ((github.event.workflow_run.name == 'Storefront checks' && vars.COOLIFY_BESOINAVOCAT_WWW_AUTODEPLOY_ENABLED == 'true') ||
           (github.event.workflow_run.name == 'Platform pilot checks' && vars.COOLIFY_BESOINAVOCAT_PORTAL_AUTODEPLOY_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CI_NAME: ${{ github.event.workflow_run.name }}
      WWW_DEPLOY_URL: ${{ secrets.COOLIFY_BESOINAVOCAT_WWW_DEPLOY_WEBHOOK }}
      PORTAL_DEPLOY_URL: ${{ secrets.COOLIFY_BESOINAVOCAT_PORTAL_DEPLOY_WEBHOOK }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_BESOINAVOCAT_API_TOKEN }}
    steps:
      - name: Verify this successful CI checked current main
        uses: actions/github-script@v7
        env:
          VERIFIED_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = await github.rest.repos.getBranch({owner, repo, branch: "main"});
            if (branch.data.commit.sha !== process.env.VERIFIED_CI_SHA) {
              core.setFailed("Main has moved since CI: refusing stale production deploy.");
            }

      - name: Request Coolify deploy from exact main source
        shell: bash
        run: |
          set -euo pipefail
          # Each CI deploys only its own application; a missing secret never falls back to the other one.
          case "$CI_NAME" in
            "Storefront checks") COOLIFY_DEPLOY_URL="${WWW_DEPLOY_URL:-}" ;;
            "Platform pilot checks") COOLIFY_DEPLOY_URL="${PORTAL_DEPLOY_URL:-}" ;;
            *) echo "::error::Unknown CI workflow"; exit 1 ;;
          esac
          if [ -z "${COOLIFY_DEPLOY_URL:-}" ] || [ -z "${COOLIFY_DEPLOY_TOKEN:-}" ]; then
            echo "::error::Configure the Coolify deploy webhook and API token in the GitHub production environment"
            exit 1
          fi
          case "$COOLIFY_DEPLOY_URL" in
            https://coolify.takatak.ca/api/v1/deploy*) ;;
            *)
              echo "::error::Deploy URL must target the approved Coolify instance API"
              exit 1
              ;;
          esac
          curl --fail-with-body --silent --show-error --retry 2 \
            --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_DEPLOY_TOKEN}" \
            "$COOLIFY_DEPLOY_URL" >/dev/null
          echo "Coolify deploy queued for CI-verified current main. Confirm deployment health in Coolify."

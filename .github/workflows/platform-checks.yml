name: Platform pilot checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify server and browser syntax
        run: |
          node --check platform/server.mjs
          node --check platform/public/app.js
          node --check platform/tools/import-corpus.mjs
      - name: Test isolation, documents and import preparation
        run: node --test platform/test/*.test.mjs

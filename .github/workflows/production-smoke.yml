name: Production availability smoke test
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live Render site
        env:
          SITE_URL: https://besoinavocat.onrender.com
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/production-smoke.mjs; then
              echo "Production smoke succeeded (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Production smoke failed after six attempts"
              exit 1
            fi
            sleep 12
          done

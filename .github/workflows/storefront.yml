name: Storefront checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Build the copy of the WordPress site and compare every page, word for word, with the mirror
        run: |
          for f in www/build.mjs www/palette.mjs www/tools/*.mjs; do node --check "$f"; done
          python3 -m py_compile www/tools/recolour-images.py
          node www/tools/inventory-content.mjs --check
          node --test www/test/*.test.mjs
          node www/build.mjs
          node www/tools/check-site.mjs
      - name: Build the Coolify image and smoke-test it
        run: |
          docker build -t besoinavocat-www:ci www
          docker run -d --name www -p 8080:80 besoinavocat-www:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"); echo "$code $1"; [ "$code" = "$2" ]; }
          check / 200
          check /famille-et-jeunesse/ 200
          check /professionnels/ 200
          check /avocat-accusation-fraude/ 200
          check /famille-et-jeunesse 301
          check /avocat-aide-juridique/ 301
          check /n-existe-pas/ 404
          check /wp-login.php 404
          check /wp-admin/ 404
          check /xmlrpc.php 404
          check /wp-json/ 404
          check /.env 404
          check /sitemap.xml 200
          check /wp-content/plugins/complianz-terms-conditions/download.php 200
          curl -sI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          curl -s http://127.0.0.1:8080/ | grep -q 'portail.besoinavocat.ca/demande'
          curl -s http://127.0.0.1:8080/ | grep -q '/assets/palette-fixes.css'
          curl -s http://127.0.0.1:8080/n-existe-pas/ | grep -qi '<title>'

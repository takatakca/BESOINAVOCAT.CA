<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Connexion d’un service · BesoinAvocat</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/integrations-callback.js" defer></script>
</head>
<body>
  <main id="main-content" class="content callback-page">
    <section class="panel">
      <div class="panel-heading"><div><span class="eyebrow">INTÉGRATIONS</span><h1 id="callback-title">Connexion en cours…</h1></div></div>
      <div class="panel-body">
        <p id="callback-message" role="status">Nous terminons la connexion de votre service. Aucun mot de passe n’est transmis à BesoinAvocat.</p>
        <p class="callback-actions"><a class="button" href="/#integrations">Retour aux intégrations</a></p>
      </div>
    </section>
  </main>
  <noscript><div class="noscript">Activez JavaScript pour terminer la connexion du service.</div></noscript>
</body>
</html>

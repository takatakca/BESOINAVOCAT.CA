# besoinavocat.ca: exact copy of the WordPress site, built by www/build.mjs. TLS is terminated by the Coolify proxy.

# The MetForm forms (/professionnels/ and the /metform-form/ pages) build their fields with new Function(); only those pages may evaluate scripts.
map $uri $ba_script_src {
  default "'self' 'unsafe-inline'";
  ~^/(professionnels|metform-form)/ "'self' 'unsafe-inline' 'unsafe-eval'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  server_tokens off;
  # Redirects keep the public scheme and host given by the proxy.
  absolute_redirect off;

  gzip on;
  gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;

  # The WordPress design runs its own scripts and inline settings (Elementor, theme, cookie banner), all served from
  # this site; the WordPress emoji check starts a worker from a blob. Requests go to the portal; two images of one
  # article come from jurigo.ca, as on WordPress.
  add_header Content-Security-Policy "default-src 'self'; script-src $ba_script_src; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://jurigo.ca https://secure.gravatar.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://portail.besoinavocat.ca; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # www.besoinavocat.ca serves the same site under one address.
  if ($host = www.besoinavocat.ca) { return 301 https://besoinavocat.ca$request_uri; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # WordPress addresses answered as besoinavocat.ca answers them (D-032): robots.txt, sitemaps and feeds are WordPress's own files (parity/).
  location = /sitemap.xml { return 301 /wp-sitemap.xml; }
  location ~ ^/wp-sitemap.*\.(xml|xsl)$ { types { application/xml xml xsl; } charset_types application/xml; }
  location = /feed/ { default_type application/rss+xml; rewrite ^ /_wp/feed.rss break; }
  location = /comments/feed/ { default_type application/rss+xml; rewrite ^ /_wp/comments-feed.rss break; }
  location = /feed { return 301 /feed/; }
  location = /comments/feed { return 301 /comments/feed/; }
  location = /index.php { return 301 /; }
  location = /favicon.ico { return 302 /wp-includes/images/w-logo-gray-white-bg.png; }
  location ~ ^/avocat-aide-juridique/?$ { return 301 /wp-content/uploads/2025/10/avocat-aide-juridique.webp; }
  # The terms PDF that WordPress generated at this address is kept as a file.
  location = /wp-content/plugins/complianz-terms-conditions/download.php { default_type application/pdf; try_files $uri =404; }
  # MetForm counts form views through WordPress; with no WordPress there is nothing to count.
  location ~ ^/wp-json/metform/v1/forms/views/ { access_log off; return 204; }
  # No administration, login, REST or PHP here: the copy has no server-side code. (wp-includes/ holds scripts and styles.)
  location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json)(/|$) { return 404; }
  location ~ \.php$ { return 404; }

  location /wp-content/ { expires 7d; }
  location /wp-includes/ { expires 7d; }
  location /vendor/ { expires 30d; }
  location /assets/ { expires 1d; }

  # /page and /page/ both reach page/index.html; without the slash nginx redirects to it, as WordPress did.
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  # A folder without a page answers 404, as on WordPress (never 403).
  error_page 403 =404 /404.html;
  location = /404.html { internal; }
}

# besoinavocat.ca storefront: static files built by www/build.mjs. TLS is terminated by the Coolify proxy.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  server_tokens off;
  # Redirects keep the public scheme and host given by the proxy.
  absolute_redirect off;

  gzip on;
  gzip_types text/css text/plain application/xml image/svg+xml;
  gzip_min_length 1024;

  # The pages carry no script; requests go to the portal, a separate origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # www.besoinavocat.ca serves the same site under one address.
  if ($host = www.besoinavocat.ca) { return 301 https://besoinavocat.ca$request_uri; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Former WordPress addresses: sitemaps, feeds and the attachment page that replaced an article.
  location = /wp-sitemap.xml { return 301 /sitemap.xml; }
  location ~ ^/wp-sitemap-.*\.xml$ { return 301 /sitemap.xml; }
  location = /sitemap_index.xml { return 301 /sitemap.xml; }
  location ~ ^/(feed|comments/feed)/?$ { return 301 /; }
  location ~ ^/avocat-aide-juridique/?$ { return 301 /avocat-aide-juridique-2/; }
  # No administration, login or PHP here: the site has no server-side code.
  location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-includes)(/|$) { return 404; }
  location ~ \.php$ { return 404; }

  location /assets/ { expires 7d; }
  location /wp-content/uploads/ { expires 30d; }

  # /page and /page/ both reach page/index.html; without the slash nginx redirects to it, as WordPress did.
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  location = /404.html { internal; }
}
